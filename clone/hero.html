<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클론 코딩 - 히어로 (img02)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Pretendard", "Malgun Gothic", sans-serif; background: #fff; color: #111; overflow-x: hidden; }

  .hero { text-align: center; padding: 120px 16px 90px; }
  .hero h1 {
    font-family: "Noto Serif KR", "Batang", serif; font-weight: 500;
    font-size: clamp(30px, 4.6vw, 56px); line-height: 1.45; letter-spacing: -0.5px;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 56px;
    padding: 18px 36px; border-radius: 999px; background: #ffe100;
    color: #111; font-size: 17px; font-weight: 600; text-decoration: none;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.12); }

  .strip {
    display: flex; gap: 0; height: clamp(260px, 36vw, 410px);
    overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .strip::-webkit-scrollbar { display: none; }
  .strip .panel {
    flex: 0 0 auto; width: clamp(180px, 18vw, 300px); height: 100%;
    background: var(--bg); scroll-snap-align: start;
    display: flex; align-items: flex-end; padding: 14px;
    color: #fff; font-size: 13px; font-weight: 600;
  }
  .strip .panel span { background: rgba(0,0,0,.35); padding: 4px 8px; border-radius: 4px; }

  .fab {
    position: fixed; right: 24px; bottom: 24px; width: 52px; height: 52px;
    border-radius: 50%; border: 1px solid rgba(0,0,0,.15); background: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,.15); cursor: pointer;
    display: grid; place-items: center; font-size: 20px;
  }
</style>
</head>
<body>
  <section class="hero">
    <h1>디자인 관점으로 콘텐츠를<br>기획하고 비즈니스와 연결합니다</h1>
    <a href="#" class="cta">프로젝트 보기 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
  </section>

  <section class="strip" id="strip"></section>

  <button class="fab" aria-label="편집">✎</button>

<script>
  const panels = [
    { label: "Design 50th",   bg: "linear-gradient(180deg,#f2f2ee 0%,#8a6a5a 60%,#c9b9a8 100%)" },
    { label: "Seoul Design",  bg: "linear-gradient(135deg,#ff3ea5,#2fd36b,#2b6cff)" },
    { label: "hey POP",       bg: "linear-gradient(180deg,#d8d8d2,#6f8a5f)" },
    { label: "Living Now",    bg: "linear-gradient(180deg,#b28a5c,#5a3a22)" },
    { label: "BUOF",          bg: "linear-gradient(135deg,#f4f7ff,#3aa0e6,#ff8a1f)" },
    { label: "LUXURY",        bg: "linear-gradient(180deg,#f5f5f5,#c93a4a)" },
    { label: "행복이 머무는 집", bg: "linear-gradient(180deg,#1d3a5c,#e8eef5)" },
  ];

  const strip = document.getElementById("strip");
  panels.forEach(p => {
    const d = document.createElement("div");
    d.className = "panel";
    d.style.setProperty("--bg", p.bg);
    d.style.background = p.bg;
    d.innerHTML = `<span>${p.label}</span>`;
    strip.appendChild(d);
  });
</script>
</body>
</html>
